on:
  workflow_call:
    secrets:
      kubeconfig:
        required: true
    inputs:
      application_name:
        type: string
        description: 'The name of the application to deploy'
        required: true
      github_environment:
        type: string
        description: 'The GitHub environment to use for the deployment'
        required: false
        default: 'production'
      helm_chart_dir:
        type: string
        description: 'Path to the directory containing the Helm chart'
        required: false
        default: './helm'
      kubernetes_namespace:
        type: string
        description: 'The Kubernetes namespace to deploy to'
        required: false
        default: 'default'
      values_file:
        type: string
        description: 'The values file for Helm deployment'
        required: false
        default: 'values.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    steps:
        - name: Checkout code
          uses: actions/checkout@v5
          
        - name: Setup Helm
          uses: azure/setup-helm@v4
          with:
            version: 'latest'
            
        - name: Create kubeconfig file
          run: |
            echo "${{ secrets.kubeconfig }}" > kubeconfig
            
        - name: Substitute variables in values file
          run: |
            if [ -f "${{ inputs.values_file }}" ]; then
              envsubst < ${{ inputs.values_file }} > /tmp/values-resolved.yaml
            else
              echo "Error: Values file ${{ inputs.values_file }} not found"
              exit 1
            fi
            
        - name: Helm deployment
          run: |
            echo "Deploying ${{ inputs.application_name }} to namespace ${{ inputs.kubernetes_namespace }} using chart ${{ inputs.helm_chart_dir }}"
            helm install ${{ inputs.application_name }} ${{ inputs.helm_chart_dir }} \
              --namespace ${{ inputs.kubernetes_namespace }} \
              --wait \
              --timeout 5m0s \
              -f /tmp/values-resolved.yaml \
              --kubeconfig ./kubeconfig